name: NodeNexus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Syntax & Import Check
      run: |
        node --check src/server.js
        node --check src/governor.js
        node --check src/nodepool.js
        node --check src/ipc_server.js
        node --check bin/nodepool
        node --check bin/nodepool-proxy
        node --check bin/sysgov
